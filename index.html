<!DOCTYPE html>
<html>
<head>
    <title>FixIt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FixIt</h1>
        <p>Report and track issues easily.</p>
    </header>

    <main>

        <section class="issues-section">
            <h2>Recent Issues</h2>
            <p>View and track reported problems.</p>
        </section>

        <section class="report-section">
            <h2>Report an Issue</h2>
            <button type="button">Report an Issue</button>
            <div id="report-form">
                <h3>Report a Problem</h3>

                <label for="reporter-email">Reporter Mail ID:</label>
                <input type="email" id="reporter-email" placeholder="Enter your mail ID">

                <br><br>

                <label for="problem-type">Type of Problem:</label>
                <select id="problem-type">
                    <option value="">Choose a problem</option>
                    <option value="electrical">Electrical</option>
                    <option value="plumbing">Plumbing</option>
                    <option value="cleaning">Cleaning</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="other">Other</option>
                </select>

                <br><br>

                <label for="description">Description:</label>
                <textarea id="description" placeholder="Describe the problem"></textarea>

                <br><br>

                <button type="button">Submit Issue</button>
            </div>
        </section>

    </main>
    <script>
        const button = document.querySelector("button");
        const form = document.querySelector("#report-form");
        button.addEventListener("click", function() {
            form.style.display = "block";
        });
    </script>
</body>
</html>
