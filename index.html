<!DOCTYPE html>
<html>
<head>
    <title>FixIt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FixIt</h1>
        <p>From Breakdowns to Breakthroughs</p>
    </header>

    <main>

        <section class="issues-section">
            <h2>Recent Issues</h2>
            <p>View and track reported problems.</p>
            <div id="issue-list"></div>
        </section>

        <section class="report-section">
            <h2>Report an Issue</h2>
            <button id="reportbutton" type="button">Report an Issue</button>
            <div id="report-form">
                <h3>Report a Problem</h3>

                <label for="reporter-email">Reporter Mail ID:</label>
                <br>
                <input type="email" id="reporter-email" placeholder="Enter your mail ID">

                <br><br>

                <label for="problem-type">Type of Problem:</label>
                <br>
                <select id="problem-type">
                    <option value="">Choose a problem</option>
                    <option value="electrical">Electrical</option>
                    <option value="plumbing">Plumbing</option>
                    <option value="cleaning">Cleaning</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="other">Other</option>
                </select>

                <br><br>
                <label for="location">Location of the problem:</label>
                <br>
                <input id="location" placeholder="Location">
                <br><br>

                <label for="description">Description:</label>
                <br>
                <textarea id="description" placeholder="Describe the problem"></textarea>

                <br><br>

                <button id="submit-button" type="button">Submit Issue</button>
            </div>
        </section>

    </main>
    <script>
        const issueList = document.querySelector("#issue-list");
        const reportbutton = document.querySelector("#reportbutton");
        const form = document.querySelector("#report-form");
        const submitButton = document.querySelector("#submit-button");
        reportbutton.addEventListener("click", function() {
            form.style.display = "block";});
        submitButton.addEventListener("click", function() {
            const email = document.querySelector("#reporter-email").value;
            const problemType = document.querySelector("#problem-type").value;
            const description = document.querySelector("#description").value;
            const location = document.querySelector("#location").value;
            
            const issueCard = document.createElement("div");
            issueCard.textContent = email + " - " + problemType + " - " + location + " - " + description;
            issueList.appendChild(issueCard);

            document.querySelector("#reporter-email").value = "";
            document.querySelector("#problem-type").value = "";
            document.querySelector("#location").value = "";
            document.querySelector("#description").value = "";
            form.style.display = "none";
        });
    </script>
</body>
</html>
