<!DOCTYPE html>
<html>
<head>
    <title>FixIt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FixIt</h1>
        <p>Report and track issues easily.</p>
    </header>

    <main>

        <section class="issues-section">
            <h2>Recent Issues</h2>
            <p>View and track reported problems.</p>
        </section>

        <section class="report-section">
            <h2>Report an Issue</h2>
            <button type="button">Report an Issue</button>
            <div id="report-form">
                <h3>Report a Problem</h3>

                <input type="text" placeholder="Issue title">

                <br><br>

                <textarea placeholder="Describe the issue"></textarea>

                <br><br>

                <button type="button">Submit Issue</button>
            </div>
        </section>

    </main>
    <script>
        const button = document.querySelector("button");
        const form = document.querySelector("#report-form");
        button.addEventListener("click", function() {
            form.style.display = "block";
        });
    </script>
</body>
</html>
